<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانگهێشتنامەی هاوسەرگیری</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        video.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <video id="vid1" class="active" autoplay muted playsinline>
        <source src="https://raw.githubusercontent.com/kakfaro/projekt1/main/From%20Klickpin.com-%20Soft%20peaceful%20sayings%20and%20clever%20inspiration%20on%20a%20budget%20for%20your%20next%20post-pin-id-986147649682857514.mov" type="video/mp4">
    </video>

    <video id="vid2" playsinline>
        <source src="https://raw.githubusercontent.com/kakfaro/projekt1/main/copy_461DF10B-EED8-4A14-9612-7FC3C94F87FB.mov" type="video/mp4">
    </video>

    <video id="vid3" playsinline loop>
        <source src="https://raw.githubusercontent.com/kakfaro/projekt1/main/a_Make_it_a_little_spa.mp4" type="video/mp4">
    </video>
</div>

<audio id="bgAudio" loop preload="auto">
    <source src="https://raw.githubusercontent.com/kakfaro/projekt1/main/v24044gl0000d9vh79nog65uh9an4j7g.mp4" type="audio/mp4">
</audio>

<script>
    const vid1 = document.getElementById('vid1');
    const vid2 = document.getElementById('vid2');
    const vid3 = document.getElementById('vid3');
    const audio = document.getElementById('bgAudio');

    // هه‌وڵدان بۆ لێدانی دەنگ لەگەڵ ڕەن بوونی پەڕەکە
    window.addEventListener('load', () => {
        audio.play().catch(() => {
            // ئەگەر وێبگەڕ ڕێگەی نەدا، بە کەمی لێدانی یەکەم کرتە دەنگەکە چالاک دەکات
            document.body.addEventListener('click', () => {
                audio.play();
            }, { once: true });
        });
    });

    // گواستنەوە لە ڤیدیۆی یەکەمەوە بۆ دووەم
    vid1.onended = function() {
        vid1.classList.remove('active');
        vid2.classList.add('active');
        vid2.play();
    };

    // گواستنەوە لە ڤیدیۆی دووەمەوە بۆ سێیەم (بانگهێشتنامە)
    vid2.onended = function() {
        vid2.classList.remove('active');
        vid3.classList.add('active');
        vid3.play();
    };
</script>

</body>
</html>
